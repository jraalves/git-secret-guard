title = "gitleaks config — padrão de repositório de portfólio (SRE)"

# Uso:
#   gitleaks detect --source . --config tools/gitleaks.toml          # repo inteiro (histórico)
#   gitleaks protect --staged --config tools/gitleaks.toml           # pré-commit
# No CI: falhar o pipeline se qualquer regra abaixo acusar.

[extend]
useDefault = true          # herda as ~150 regras de provedores conhecidos

[[rules]]
id = "dotenv-credential-file"
description = "arquivo de ambiente com credenciais nunca entra no versionamento"
regex = '''(?i)(^|/)\.env(\.[a-z0-9-]+)?'''
path = '''(?i)(^|/)\.env(\.[a-z0-9-]+)?'''
tags = ["blocked-file", "crítica"]

[[rules]]
id = "credentials-doc"
description = "documento de credencial (CREDENCIAIS.md e variantes)"
regex = '''(?i)(credenciais|credentials|senhas?\.md|segredos\.md)\.(md|txt|docx?)$'''
path = '''(?i)(credenciais|credentials|senhas?\.md|segredos\.md)\.(md|txt|docx?)$'''
tags = ["blocked-file", "crítica"]

[[rules]]
id = "connection-string-with-password"
description = "string de conexão com usuário e senha embutidos"
regex = '''(?i)(mongo(db)?(\+srv)?|postgres(ql)?|mysql|mssql|redis|amqp)://[^:/\s]+:[^:/\s]+@[^\s"'<]+'''
tags = ["credential", "crítica"]

[[rules]]
id = "jwt-signing-secret"
description = "segredo de assinatura de token em texto claro"
regex = '''(?i)(jwt[_-]?(secret|key)|signing[_-]?key|secret[_-]?key)\s*[:=]\s*['"][A-Za-z0-9_\-\.=/+]{12,}['"]'''
tags = ["credential", "crítica"]

[[rules]]
id = "inline-password-literal"
description = "senha atribuída como literal (seed, script, config de teste)"
regex = '''(?i)(password|passwd|pwd|senha)\s*[:=]\s*['"][^'"]{6,}['"]'''
tags = ["credential", "alta"]
[[rules]]
id = "cnpj-br"
description = "CNPJ de empresa real em dado versionado"
regex = '''\b\d{2}\.\d{3}\.\d{3}\/\d{4}-\d{2}\b'''
tags = ["pii", "alta"]

[[rules]]
id = "cpf-br"
description = "CPF em dado versionado"
regex = '''\b\d{3}\.\d{3}\.\d{3}-\d{2}\b'''
tags = ["pii", "alta"]

[[rules]]
id = "internal-topology"
description = "IP privado ou hostname interno revelando topologia"
regex = '''\b(?:192\.168|10|172\.1[6-9]|172\.2[0-9]|172\.3[01]|100\.64)\.\d{1,3}\.\d{1,3}(:\d+)?\b|\b[a-z0-9.-]+\.(?:local|internal|corp|lan|ddns\.net)\b'''
tags = ["topology", "média"]

[[rules]]
id = "windows-user-path"
description = "caminho absoluto de posto de trabalho revela usuário/topologia"
regex = '''\b[A-Za-z]:\\\\Users\\\\[^\s"'\\]+'''
tags = ["topology", "média"]

[[rules]]
id = "venv-or-artifacts"
description = "ambiente virtual e artefatos não pertencem ao repositório"
regex = '''(^|/)(venv|\.venv|node_modules|__pycache__|dist|build|site-packages)/'''
tags = ["hygiene", "média"]

[[rules]]
id = "database-dump"
description = "dump/seed com dados (manter esquema, nunca dados)"
regex = '''(?i)(^|/).*\.(sql|dump|bak|sqlite3?)(\.gz)?$'''
tags = ["data", "média"]

[allowlist]
description = "falsos positivos controlados"
paths = [
  '''\.env\.example$''',
  '''(^|/)tools/gitleaks\.toml$''',
  '''(^|/)docs/exemplos/''',
  '''(^|/)tests/fixtures/sinteticos/''',
]
regexes = [
  '''(?i)(seu[_-]?segredo|your[_-]?secret|changeme|placeholder|exemplo[-_]?ficticio|<[A-Z][A-Z0-9_:]*>)''',
  '''12\.345\.678/0001[-]00''',          # CNPJ de manual, sequencial
  '''\b(000|111|123|321)\.\d{3}\.\d{3}''',
]
